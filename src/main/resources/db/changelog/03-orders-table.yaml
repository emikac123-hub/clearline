databaseChangeLog:
  - changeSet:
      id: create-table-tenants
      author: system
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: order_id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_order
              - column:
                  name: bid_placed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false 
              - column:
                  name: bid_placed_by
                  type: TIMESTAMP
                  constraints:
                    nullable: false           
              - column:
                  name: modified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: modified_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: sku_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: status #possible status could be ORDERED, PROCESSED, DENIED, WITHDRAWN, BID_ON
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "orders"
            baseColumnNames: "sku_id"
            constraintName: "fk_sku_id"
            referencedTableName: "sku"
            referencedColumnNames: "sku_id"
            onDelete: CASCADE
            onUpdate: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: "orders"
            baseColumnNames: "tenant_id"
            constraintName: "fk_tenant_id"
            referencedTableName: "tenants"
            referencedColumnNames: "tenant_id"
            onDelete: CASCADE
            onUpdate: RESTRICT