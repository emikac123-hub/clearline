databaseChangeLog:
  - changeSet:
      id: create-table-orders
      author: system
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: order_id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_order
              - column:
                  name: bid_placed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false 
              - column:
                  name: bid_placed_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false           
              - column:
                  name: modified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: modified_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: status #RESERVED or REJECTED
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: rejection_reason
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: "orders"
            baseColumnNames: "tenant_id"
            constraintName: "fk_tenant_orders_id"
            referencedTableName: "tenants"
            referencedColumnNames: "tenant_id"
            onDelete: CASCADE
            onUpdate: RESTRICT