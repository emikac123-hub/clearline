databaseChangeLog:
  - changeSet:
      id: create-table-order-lines
      author: system
      changes:
        - createTable:
            tableName: order_lines
            columns:
              - column:
                  name: order_lines_id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_order_lines
              - column:
                  name: qty
                  type: int
                  constraints:
                    nullable: false
                    checkConstraint: "qty >= 0"            
              - column:
                  name: modified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: modified_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: sku_id
                  type: uuid

                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: uuid
        
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "order_lines"
            baseColumnNames: "sku_id"
            constraintName: "fk_sku_order_line_id"
            referencedTableName: "skus"
            referencedColumnNames: "sku_id"
            onDelete: CASCADE
            onUpdate: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: "order_lines"
            baseColumnNames: "order_id"
            constraintName: "fk_order_order_line_id"
            referencedTableName: "orders"
            referencedColumnNames: "order_id"
            onDelete: CASCADE
            onUpdate: RESTRICT