databaseChangeLog:
  - changeSet:
      id: create-table-tenants
      author: system
      changes:
        - createTable:
            tableName: order_lines
            columns:
              - column:
                  name: order_lines_id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_order_lines
              - column:
                  name: order_quantity
                  type: number
                  constraints:
                    nullable: false              
              - column:
                  name: modified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: modified_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: sku_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: orders_placed
                  type: number
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "order_lines"
            baseColumnNames: "sku_id"
            constraintName: "fk_sku_id"
            referencedTableName: "sku"
            referencedColumnNames: "sku_id"
            onDelete: CASCADE
            onUpdate: RESTRICT