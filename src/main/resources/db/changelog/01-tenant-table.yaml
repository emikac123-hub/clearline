databaseChangeLog:
  - changeSet:
      id: create-table-tenants
      author: system
      changes:
        - createTable:
            tableName: tenants
            columns:
              - column:
                  name: tenant_id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_tenants
              - column:
                  name: tenant_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: modified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: modified_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_known_access
                  type: TIMESTAMP
                  constraints:
                    nullable: true
