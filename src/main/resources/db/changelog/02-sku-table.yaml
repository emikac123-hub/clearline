databaseChangeLog:
  - changeSet:
      id: create-table-tenants
      author: system
      changes:
        - createTable:
            tableName: sku
            columns:
              - column:
                  name: sku_id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_sku
              - column:
                  name: display_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: number
                  constraints:
                    nullable: false
              - column:
                  name: modified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: modified_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "sku"
            baseColumnNames: "tenant_id"
            constraintName: "fk_tenant_id"
            referencedTableName: "tenants"
            referencedColumnNames: "tenant_id"
            onDelete: CASCADE
            onUpdate: RESTRICT

