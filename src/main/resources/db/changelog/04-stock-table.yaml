databaseChangeLog:
  - changeSet:
      id: create-table-stock
      author: system
      changes:
        - createTable:
            tableName: stock
            columns:
              - column:
                  name: stock_id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_stock
              - column:
                  name: qty
                  type: int
                  constraints:
                    nullable: false
                    checkConstraint: "qty >= 0"
              - column:
                  name: modified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: modified_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: sku_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  constraints:
                    nullable: false
                  defaultValue: "0"


        - addUniqueConstraint:
            tableName: "stock"
            columnNames: tenant_id, sku_id
            constraintName: "uq_tenant_sku"
        - addForeignKeyConstraint:
            baseTableName: "stock"
            baseColumnNames: "sku_id"
            constraintName: "fk_sku_stock_id"
            referencedTableName: "skus"
            referencedColumnNames: "sku_id"
            onDelete: CASCADE
            onUpdate: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: "stock"
            baseColumnNames: "tenant_id"
            constraintName: "fk_tenant_stock_id"
            referencedTableName: "tenants"
            referencedColumnNames: "tenant_id"
            onDelete: CASCADE
            onUpdate: RESTRICT