databaseChangeLog:
  - changeSet:
      id: create-table-tenants
      author: system
      changes:
        - createTable:
            tableName: reservations
            columns:
              - column:
                  name: reservation_id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_reservations
              - column:
                  name: order_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: sku_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: qty
                  type: number
                  constraints:
                    nullable: false              
              - column:
                  name: modified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: modified_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: orders_placed
                  type: number
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: "reservations"
            baseColumnNames: "sku_id"
            constraintName: "fk_sku_reservations_id"
            referencedTableName: "skus"
            referencedColumnNames: "sku_id"
            onDelete: CASCADE
            onUpdate: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: "reservations"
            baseColumnNames: "order_id"
            constraintName: "fk_order_reservations_id"
            referencedTableName: "orders"
            referencedColumnNames: "order_id"
            onDelete: CASCADE
            onUpdate: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: "reservations"
            baseColumnNames: "tenant_id"
            constraintName: "fk_tenant_reservations_id"
            referencedTableName: "tenant"
            referencedColumnNames: "tenant_id"
            onDelete: CASCADE
            onUpdate: RESTRICT