databaseChangeLog:
  - changeSet:
      id: create-table-tenants
      author: system
      changes:
        - createTable:
            tableName: stock
            columns:
              - column:
                  name: stock_id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_stock
              - column:
                  name: inventory
                  type: number
                  constraints:
                    nullable: false              
              - column:
                  name: modified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: modified_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: sku_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: orders_placed
                  type: number
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "stock"
            baseColumnNames: "sku_id"
            constraintName: "fk_sku_id"
            referencedTableName: "sku"
            referencedColumnNames: "sku_id"
            onDelete: CASCADE
            onUpdate: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: "stock"
            baseColumnNames: "tenant_id"
            constraintName: "fk_tenant_id"
            referencedTableName: "tenants"
            referencedColumnNames: "tenant_id"
            onDelete: CASCADE
            onUpdate: RESTRICT